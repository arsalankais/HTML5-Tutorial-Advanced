<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multipage Class ID in HTML</title>
    <style>
        .third{
            background-color: aqua;
        }
        #second{
            background-color: red;
        }
        #first{
            background-color: green ;
        }
    </style>
</head>
<body>
    <h1 id="first">hello coder army</h1>
    <h2 id="second">kaise ho sab</h2>
    <p class="third">hum sab badhiya hai </p>
    <p class="third">hello badhiya!</p>
    <p class="third">Money</p>
    <ul class="third">
        <li>Rohit</li>
        <li>Mohit</li>
        <li>Rohan</li>
        <li>Mohan</li>
        <li>Soham</li>
    </ul>
</body>
</html>
