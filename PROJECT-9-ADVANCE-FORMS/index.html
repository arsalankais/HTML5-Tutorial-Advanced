<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project9:Advaned Forms in HTML</title>
</head>

<body>
    <h1>Employee Details Form</h1>
    <form>

        <label for="uname">Full Name</label>
        <input type="text" name="uname" id="uname" placeholder="Enter Your Full Name" required>
        <br><br>

        <label for="uemail">Email:</label>
        <input type="email" name="uemail" id="uemail" placeholder="Enter Your Email" required>
        <br><br>

        <label for="uphone">Phone Number:</label>
        <input type="tel" name="uphone" id="uphone" placeholder="Enter Your Phone Number" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" id="male" value="Male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="Female">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="other" value="Other">
        <label for="other">Other</label>
        <br><br>
        <label for="ujob">Job Title:</label>
        <input type="text" name="ujob" id="ujob" placeholder="Enter Job Title" required>

        <br><br>
        <label for="udepartment">Department:</label>
        <select name="udepartment" id="udepartment">
            <option value="" disabled selected>Select Your Department</option>
            <option value="Engineer">Engineer</option>
            <option value="Doctor">Doctor</option>
            <option value="Finance">Finance</option>
            <option value="Rest">Rest</option>

        </select>


        <br><br>
        <button>Submit</button>
    </form>
</body>

</html>
