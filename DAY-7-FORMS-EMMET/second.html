<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Forms Emmets in HTML</title>
</head>

<body>
    <!-- form means we input data from the user -->
    <form>
        <label for="first">Name:</label>
        <input type="text" id="first" name="fname" required placeholder="Enter Your Name">


        <br><br>
        <label for="second">Age</label>
        <input type="number" id="second" name="ageofuser" required placeholder="Enter Your Age">

        <br><br>
        <label for="third">Password</label>
        <input type="password" id="third" name="passuser" placeholder="Enter your password">

        <br><br>
        <button>Submit</button>
    </form>
</body>

</html>
