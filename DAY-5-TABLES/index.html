<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Arsalan</td>
                <td>19</td>
                <td>15000</td>
            </tr>
            <tr>
                <td>Hamza</td>
                <td>20</td>
                <td>10000</td>
            </tr>
            <tr>
                <td>Hitesh</td>
                <td>21</td>
                <td>13000</td>
            </tr>
            <tr>
                <td>Yusuf</td>
                <td>23</td>
                <td>12000</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
