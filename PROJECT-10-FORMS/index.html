<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project10:Forms in HTML</title>
</head>

<body>

    <form>

        <h1>Welcome to Our FORMS Section</h1>
        <hr>
        <h2>Contact US</h2>
        <label for="fname">Full Name:</label>
        <input type="text" name="fname" id="fname" required placeholder="Enter your name">
        <br><br>
        <label for="uemail">Email:</label>
        <input type="email" name="uemail" id="uemail" required placeholder="arsalan7@gmail.com">

        <br><br>
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" required placeholder="Enter your Age">
        <br><br>

        <label for="pnum">Phone Number::</label>
        <input type="tel" name="pnum" id="pnum" required placeholder="enter Number">
        <br><br>

        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" required placeholder="Enter You Password">
        <br><br>

        <label for="msg">Message:</label>
        <textarea name="msg" id="msg" rows="10" cols="50"></textarea>
        <br><br>
        <button>Send</button>
    </form>

</body>

</html>
