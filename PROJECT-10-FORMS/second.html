<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project10:Forms in HTML</title>
</head>

<body>

    <form>

        <h1>User Registration Form</h1>
        <label for="fname">UserName:</label>
        <input type="text" name="fname" id="fname" required placeholder="Enter Your Username">
        <br><br>

        <label for="uemail">Email:</label>
        <input type="email" name="uemail" id="uemail" required placeholder="arsalan7@gmail.com">

        <br><br>
        <label for="pass">Password:</label>
        <input type="password" name="pass" id="pass" required placeholder="Enter You Password">
        <br><br>


        <label>Gender:</label>
        <input type="radio" name="gender" id="male" value="Male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="Female">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="other" value="other">
        <label for="other">Other</label>
        <br><br>
        <input type="checkbox" name="terms" id="terms">
        <label for="terms">I Agree To The Terms and condition</label>
        <br><br>
        <button>Register</button>
    </form>

</body>

</html>
