<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List-Anchor-Image-Tags in HTML</title>
</head>

<body>
    <ol>
        <li>Array
            <ul>
                <li>1D Array</li>
                <li>2D Array</li>
            </ul>
        </li>
        <li>Linked List
            <ul>
                <li>Simply Linked Lists</li>
                <li>Doubly Linked Lists</li>
                <li>Circular Linked Lists
                    <ol>
                        <li>Doubly Circular Linked lists</li>
                        <li>Triply Circular Linked lists</li>
                    </ol>
                </li>
            </ul>
        </li>
        <li>Tree
            <ul>
                <li>Binary Tree</li>
                <li>Binary Search Tree</li>
                <li>AVL Tree</li>
                <li>Black Tree</li>

            </ul>
        </li>
    </ol>
</body>

</html>
